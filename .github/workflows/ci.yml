name: verify project

on: [push, pull_request]

jobs:
  install:

    runs-on: ubuntu-24.04
    environment: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: app/vendor
        key: composer-lock-${{ hashFiles('**/composer.lock') }}

    - name: Define environment variables
      run: cd app/ && echo "APP_ENV=test" > .env.local && echo "MONGODB_URI=${{ vars.MONGODB_URI }}" >> .env.test.local

    - name: Install composer dependencies
      if: steps.composer-cache.outputs.cache-hit != 'true'
      run: cd app/ && composer install --prefer-dist --no-progress --no-suggest

    - name: Install assets
      run: cd app/ && ./bin/console importmap:install

    - name: Cache phive packages
      id: phive-tools-cache
      uses: actions/cache@v4
      with:
        path: app/tools
        key: phive-tools-${{ hashFiles('**/.phive/phars.xml') }}

    - name: Install phive tools
      if: steps.phive-tools-cache.outputs.cache-hit != 'true'
      run: cd app/ && wget -O phive https://phar.io/releases/phive.phar && chmod +x phive && ./phive install --trust-gpg-keys 4AA394086372C20A,99BF4D9A33D65E1E,97B02DD8E5071466,6DA3ACC4991FFAE5,C5095986493B4AA0 && chmod -R +x ./tools/

    - name: 'Tar project'
      run: tar -cf project.tar .

    - uses: actions/upload-artifact@v4
      with:
        name: installed-project
        path: project.tar

  phplint:
    needs: install
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: installed-project

    - name: Untar project.
      run:  tar -xf project.tar

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - name: Run php lint
      run: cd app/ && find ./src/ ./tests/ -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l -n | (! grep -v "No syntax errors detected" )

  phpcs:
    needs: phplint
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: installed-project

    - name: Untar project.
      run:  tar -xf project.tar

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - name: Run phpcs
      run: cd app/ && ./tools/phpcs --standard=PSR12 --extensions=php --ignore=*/Kernel.php ./src/

  test:
    needs: phplint
    runs-on: ubuntu-24.04
    environment: test

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: installed-project

    - name: Untar project.
      run:  tar -xf project.tar

    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.12.1
      with:
        mongodb-version: '8.2.4'
        mongodb-username: ${{ secrets.MONGODB_USER }}
        mongodb-password: ${{ secrets.MONGODB_PASSWORD }}
        mongodb-db: symfony-demo-test

    - name: Setup PHP with Xdebug and MongoDB
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: xdebug
        extensions: mongodb-mongodb/mongo-php-driver

    - name: Run PHPUnit test
      run: |
        cd app/ && \
        (./bin/console doctrine:migrations:diff --configuration ./config/migrations/furniture_test.yaml -e test; \
        ./bin/console doctrine:migrations:diff --configuration ./config/migrations/clothing_test.yaml -e test) && \
        (./bin/console doctrine:migrations:migrate --configuration ./config/migrations/furniture_test.yaml --no-interaction -e test; \
        ./bin/console doctrine:migrations:migrate --configuration ./config/migrations/clothing_test.yaml --no-interaction -e test) && \
        ./tools/phpunit -c ./ci/phpunit.xml

  static-analysis:
    needs: phplint
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: installed-project

    - name: Untar project.
      run:  tar -xf project.tar

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'

    - name: Run Psalm
      run: cd app/ && ./tools/psalm -c ./ci/psalm.xml --shepherd --no-cache
